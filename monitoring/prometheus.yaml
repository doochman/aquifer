global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yaml
# The launcher writes the files under /etc/prometheus/targets from the profiles and extensions you enabled,
# so a service that is not running is never reported as down.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: [redpanda:9644]
  - job_name: flink
    file_sd_configs:
      - files: [/etc/prometheus/targets/flink.json]
  - job_name: customer-profile
    file_sd_configs:
      - files: [/etc/prometheus/targets/customer-profile.json]
  - job_name: readiness
    metrics_path: /probe
    params:
      module: [http_ready]
    file_sd_configs:
      - files: [/etc/prometheus/targets/readiness.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
