# Inside the AQUIFER containers Trino is trino:8080. From your own machine set
# TRINO_HOST=localhost and TRINO_PORT=<your HOST_TRINO_PORT> (see ./lakehouse connect).
aquifer:
  target: trino
  outputs:
    trino:
      type: trino
      method: none
      user: dbt
      host: "{{ env_var('TRINO_HOST', 'trino') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | as_number }}"
      database: iceberg
      schema: shop
      http_scheme: http
      threads: 2
